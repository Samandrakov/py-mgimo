[project]
name = "mgimo"
version = "0.4.0"
description = "MGIMO datasets and Python utilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docopt>=0.6.2",
]

[project.scripts]
my-tool = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
