site_name: MGIMO Python Package
site_description: MGIMO datasets and Python utilities
site_url: https://mgimo-dd.github.io/py-mgimo
repo_url: https://github.com/mgimo-dd/py-mgimo
repo_name: mgimo-dd/py-mgimo

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на темную тему
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: ru
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source

nav:
  - Главная: index.md
  - Установка: installation.md
  - API Reference:
      - Утилиты:
          - Грейдинг: api/utils/grading.md
          - Логирование: api/utils/logging.md
          - Основные функции: api/utils/main.md
      - Квиз:
          - Столицы: api/quiz/capitals.md
      - Данные:
          - Страны и столицы: api/dataset/data.md
      - CLI: api/cli.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
